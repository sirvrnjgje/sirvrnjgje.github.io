<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Zen Particle Box</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #0f172a, #1e1b4b);
            color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        h1 {
            font-size: 2rem;
            margin: 0 0 10px 0;
            font-weight: 400;
            letter-spacing: 2px;
            color: #6366f1;
            text-shadow: 0 0 10px rgba(99, 102, 241, 0.3);
        }
        p {
            margin: 0 0 20px 0;
            color: #94a3b8;
            font-size: 0.9rem;
        }
        #canvas-container {
            position: relative;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(99, 102, 241, 0.2);
            border-radius: 16px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            width: 90vw;
            max-width: 600px;
            height: 60vh;
            max-height: 450px;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        .controls {
            margin-top: 20px;
            display: flex;
            gap: 15px;
        }
        button {
            background: rgba(99, 102, 241, 0.2);
            color: #e2e8f0;
            border: 1px solid rgba(99, 102, 241, 0.4);
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s ease;
        }
        button:hover {
            background: #6366f1;
            color: white;
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.5);
        }
    </style>
</head>
<body>

    <h1>Zen Particle Box</h1>
    <p>Move your mouse or tap inside the box to disturb the flow.</p>

    <div id="canvas-container">
        <canvas id="particleCanvas"></canvas>
    </div>

    <div class="controls">
        <button id="colorBtn">Change Colors</button>
        <button id="clearBtn">Burst</button>
    </div>

    <script>
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('canvas-container');

        let particles = [];
        let hue = 220;
        
        const mouse = {
            x: null,
            y: null,
            radius: 80
        };

        function resizeCanvas() {
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        class Particle {
            constructor(x, y) {
                this.x = x || Math.random() * canvas.width;
                this.y = y || Math.random() * canvas.height;
                this.size = Math.random() * 3 + 1;
                this.baseSpeedX = (Math.random() * 1 - 0.5) * 0.5;
                this.baseSpeedY = (Math.random() * -1 - 0.2) * 0.5; // Drift upwards naturally
                this.speedX = this.baseSpeedX;
                this.speedY = this.baseSpeedY;
                this.color = `hsla(${hue + Math.random() * 40}, 85%, 65%, ${Math.random() * 0.7 + 0.3})`;
            }

            update() {
                // Return to base speed gradually
                this.speedX += (this.baseSpeedX - this.speedX) * 0.05;
                this.speedY += (this.baseSpeedY - this.speedY) * 0.05;

                // Mouse interaction physics
                if (mouse.x !== null && mouse.y !== null) {
                    let dx = mouse.x - this.x;
                    let dy = mouse.y - this.y;
                    let distance = Math.hypot(dx, dy);
                    
                    if (distance < mouse.radius) {
                        let force = (mouse.radius - distance) / mouse.radius;
                        let angle = Math.atan2(dy, dx);
                        // Push away from mouse
                        this.speedX -= Math.cos(angle) * force * 1.5;
                        this.speedY -= Math.sin(angle) * force * 1.5;
                    }
                }

                this.x += this.speedX;
                this.y += this.speedY;

                // Wrap boundaries
                if (this.x < 0) this.x = canvas.width;
                if (this.x > canvas.width) this.x = 0;
                if (this.y < 0) {
                    this.y = canvas.height;
                    this.x = Math.random() * canvas.width;
                }
                if (this.y > canvas.height) this.y = 0;
            }

            draw() {
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function init() {
            particles = [];
            const particleCount = Math.min(120, (canvas.width * canvas.height) / 1500);
            for (let i = 0; i < particleCount; i++) {
                particles.push(new Particle());
            }
        }
        init();

        function animate() {
            ctx.fillStyle = 'rgba(15, 23, 42, 0.12)'; // Creates a trailing blur effect
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();
            }
            requestAnimationFrame(animate);
        }
        animate();

        // Track Pointer Actions
        function handlePointerMove(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            mouse.x = clientX - rect.left;
            mouse.y = clientY - rect.top;
        }

        function handlePointerLeave() {
            mouse.x = null;
            mouse.y = null;
        }

        container.addEventListener('mousemove', handlePointerMove);
        container.addEventListener('mouseleave', handlePointerLeave);
        container.addEventListener('touchmove', handlePointerMove);
        container.addEventListener('touchend', handlePointerLeave);

        // Control Buttons
        document.getElementById('colorBtn').addEventListener('click', () => {
            hue = (hue + 60) % 360;
            init();
        });

        document.getElementById('clearBtn').addEventListener('click', () => {
            particles.forEach(p => {
                p.speedX = (Math.random() * 20 - 10);
                p.speedY = (Math.random() * 20 - 10);
            });
        });
    </script>
</body>
</html>
